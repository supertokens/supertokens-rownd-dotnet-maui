# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Foundation unit tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Test
      run: dotnet test tests/Rownd.UnitTests/Rownd.UnitTests.csproj -c Release
    - name: Compile opt-in integration checks (do not run)
      run: dotnet build tests/Rownd.IntegrationTests/Rownd.IntegrationTests.csproj -c Release
